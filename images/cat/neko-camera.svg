<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- camera -->
  <rect x="30" y="48" width="40" height="28" rx="4" fill="#555"/>
  <rect x="42" y="44" width="16" height="6" rx="2" fill="#666"/>
  <circle cx="50" cy="62" r="9" fill="#333"/>
  <circle cx="50" cy="62" r="6" fill="#6B9BC3"/>
  <circle cx="50" cy="62" r="2" fill="#fff" opacity="0.4"/>
  <!-- flash -->
  <rect x="62" y="50" width="4" height="3" rx="1" fill="#F5C78A"/>
  <!-- cat behind camera -->
  <g fill="#E8913A">
    <circle cx="50" cy="38" r="14"/>
    <polygon points="38,28 33,14 41,24"/>
    <polygon points="62,28 67,14 59,24"/>
    <!-- paws holding camera -->
    <ellipse cx="32" cy="60" rx="5" ry="6" fill="#E8913A"/>
    <ellipse cx="68" cy="60" rx="5" ry="6" fill="#E8913A"/>
  </g>
  <!-- focused eye (one open, one squinting) -->
  <circle cx="44" cy="36" r="2.5" fill="#333"/>
  <path d="M52,35 Q55,32 58,35" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round"/>
  <path d="M48,42 Q50,44 52,42" fill="none" stroke="#333" stroke-width="1" stroke-linecap="round"/>
</svg>
