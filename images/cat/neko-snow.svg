<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- snowflakes -->
  <text x="15" y="20" font-size="12" fill="#88b7d5" opacity="0.6">❄</text>
  <text x="75" y="15" font-size="10" fill="#88b7d5" opacity="0.4">❄</text>
  <text x="85" y="40" font-size="8" fill="#88b7d5" opacity="0.5">❄</text>
  <text x="10" y="50" font-size="9" fill="#88b7d5" opacity="0.3">❄</text>
  <!-- cat with scarf -->
  <g fill="#E8913A">
    <ellipse cx="50" cy="64" rx="22" ry="22"/>
    <circle cx="50" cy="40" r="16"/>
    <polygon points="36,30 30,14 42,24"/>
    <polygon points="64,30 70,14 58,24"/>
  </g>
  <!-- scarf -->
  <path d="M34,52 Q50,58 66,52" fill="#D4726A" stroke="#c0645a" stroke-width="1"/>
  <rect x="58" y="52" width="8" height="18" rx="3" fill="#D4726A"/>
  <g fill="#fff"><ellipse cx="50" cy="70" rx="14" ry="10"/></g>
  <g fill="#333">
    <circle cx="44" cy="38" r="2.5"/>
    <circle cx="56" cy="38" r="2.5"/>
  </g>
  <path d="M48,43 Q50,46 52,43" fill="none" stroke="#333" stroke-width="1.2" stroke-linecap="round"/>
  <!-- rosy cheeks -->
  <circle cx="38" cy="43" r="3" fill="#F5A0A0" opacity="0.4"/>
  <circle cx="62" cy="43" r="3" fill="#F5A0A0" opacity="0.4"/>
</svg>
