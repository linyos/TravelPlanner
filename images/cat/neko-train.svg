<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- train window frame -->
  <rect x="10" y="45" width="80" height="45" rx="6" fill="#555"/>
  <rect x="14" y="49" width="72" height="37" rx="4" fill="#dceef7"/>
  <!-- window scenery -->
  <rect x="14" y="49" width="72" height="20" fill="#87CEEB"/>
  <path d="M14,69 L30,58 L50,65 L70,55 L86,62 L86,86 L14,86Z" fill="#7BAE7F"/>
  <!-- cat in window -->
  <g fill="#E8913A">
    <ellipse cx="50" cy="75" rx="16" ry="14"/>
    <circle cx="50" cy="62" r="12"/>
    <polygon points="40,54 36,42 44,50"/>
    <polygon points="60,54 64,42 56,50"/>
  </g>
  <g fill="#fff"><ellipse cx="50" cy="78" rx="10" ry="6"/></g>
  <g fill="#333">
    <circle cx="46" cy="60" r="2"/>
    <circle cx="54" cy="60" r="2"/>
  </g>
  <path d="M48,64 Q50,66 52,64" fill="none" stroke="#333" stroke-width="1" stroke-linecap="round"/>
  <!-- paws on window sill -->
  <ellipse cx="42" cy="72" rx="4" ry="3" fill="#F5C78A"/>
  <ellipse cx="58" cy="72" rx="4" ry="3" fill="#F5C78A"/>
  <!-- wheels -->
  <circle cx="25" cy="93" r="4" fill="#333"/>
  <circle cx="75" cy="93" r="4" fill="#333"/>
</svg>
